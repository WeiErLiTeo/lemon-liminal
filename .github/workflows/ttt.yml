name: Rollback to Commit

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'Target Commit SHA'
        required: true
        default: 'c5668c3'

jobs:
  reset_to_commit:
    name: Revert to Commit
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Overwrite to Target Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 签出主分支
          git checkout ${{ github.ref_name }}

          # 还原工作区所有内容，但排除 .github 目录以绕过 Actions 权限拦截
          git checkout ${{ github.event.inputs.target_commit }} -- .
          git checkout HEAD -- .github

          # 清理目标版本之后新增的文件（保留 .github 配置）
          git clean -fd -e .github

          # 暂存、提交并推送
          git add -A
          git commit -m "revert: rollback images and data to ${{ github.event.inputs.target_commit }} [skip ci]" || echo "No changes"
          git push origin ${{ github.ref_name }}

      - name: Purge CDN Cache for images.json
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/images.json" || true
          echo "CDN cache purged for images.json"
