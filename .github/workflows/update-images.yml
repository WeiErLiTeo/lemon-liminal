name: Auto Generate Images JSON

on:
  push:
    paths:
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'

jobs:
  build:
  name: Generate Image List JSON
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate JSON
        run: |
          python3 - << 'EOF'
          import os
          import json

          # 要扫描的套组文件夹名（对应你的 6 个文件夹）
          folders = [
              "cyber-violet-ticket",
              "cobalt-street-cozy",
              "pastel-ribbon-girls",
              "Sleep-Tight",
              "Do_You_Even_DJ",
              "glossy-clay-crt"
          ]

          result = {}
          for folder in folders:
              if os.path.exists(folder) and os.path.isdir(folder):
                  # 获取文件夹内所有常见图片格式
                  files = [
                      f for f in os.listdir(folder)
                      if f.lower().endswith(('.png', '.jpg', '.jpeg', '.webp'))
                  ]
                  files.sort()  # 按文件名排序
                  result[folder] = files
              else:
                  result[folder] = []

          # 写入根目录的 images.json
          with open("images.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          print("images.json generated successfully!")
          EOF

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add images.json
          git diff --staged --quiet || git commit -m "chore: auto-update images.json"
          git push
