name: Auto Crop, Convert WebP and Sync Images
on:
  push:
    paths:
      - '/*.png'
      - '/.jpg'
      - '/.jpeg'
      - '/*.webp'
      - '.github/workflows/update-images.yml'
  workflow_dispatch:

jobs:
  optimize_and_sync:
    name: Crop, Convert & Renumber
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow Imaging Library
        run: |
          pip install --upgrade Pillow

      - name: Crop, Convert WebP and Sync JSON
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - << 'EOF'
          import os
          import re
          import json
          import shutil
          import urllib.request
          from PIL import Image

          img_exts = ('.png', '.jpg', '.jpeg', '.webp')
          TARGET_RATIO = 16.0 / 9.0
          MAX_WIDTH = 1440
          WEBP_QUALITY = 92

          def natural_sort_key(s):
              return [int(t) if t.isdigit() else t.lower() for t in re.split(r'(\d+)', s)]

          def process_image(src_path, dest_path):
              """智能 16:9 居中裁切并输出视网膜级高质量 WebP"""
              with Image.open(src_path) as im:
                  if im.mode not in ('RGB', 'RGBA'):
                      im = im.convert('RGBA')

                  w, h = im.size
                  current_ratio = w / float(h)

                  if current_ratio > TARGET_RATIO:
                      new_w = int(round(h * TARGET_RATIO))
                      left = (w - new_w) // 2
                      box = (left, 0, left + new_w, h)
                  else:
                      new_h = int(round(w / TARGET_RATIO))
                      top = (h - new_h) // 2
                      box = (0, top, w, top + new_h)

                  cropped_im = im.crop(box)

                  if cropped_im.width > MAX_WIDTH:
                      target_h = int(round(MAX_WIDTH / TARGET_RATIO))
                      cropped_im = cropped_im.resize((MAX_WIDTH, target_h), Image.Resampling.LANCZOS)

                  os.makedirs(os.path.dirname(dest_path), exist_ok=True)
                  cropped_im.save(dest_path, 'WEBP', quality=WEBP_QUALITY, method=6)

          result = {}
          purges = []

          for root, dirs, files in os.walk('.'):
              # 忽略系统隐藏目录及脚本生成的单图子文件夹，避免递归污染
              dirs[:] = [
                  d for d in dirs
                  if not d.startswith('.')
                  and not re.match(r'^card-\d+$', d)
                  and not d.startswith('__temp')
              ]

              # 筛选当前目录下的直接图片文件，跳过临时转码中转文件
              imgs = [
                  f for f in files
                  if f.lower().endswith(img_exts)
                  and not f.startswith('__temp')
              ]
              if not imgs:
                  continue

              folder = os.path.relpath(root, '.')
              if folder == '.':
                  continue

              imgs.sort(key=natural_sort_key)
              pad = max(2, len(str(len(imgs))))

              final_names = []
              temp_entries = []

              for idx, orig_file in enumerate(imgs, start=1):
                  base_name = f"card-{idx:0{pad}d}"
                  final_webp_name = f"{base_name}.webp"
                  final_names.append(final_webp_name)

                  orig_path = os.path.join(root, orig_file)
                  temp_webp_path = os.path.join(root, f"_temp{idx}.webp")

                  # 云端裁切并转码为高质量 WebP
                  process_image(orig_path, temp_webp_path)

                  # 确保目标同名子文件夹创建成功后再执行复制
                  img_subfolder = os.path.join(root, base_name)
                  os.makedirs(img_subfolder, exist_ok=True)
                  subfolder_dest = os.path.join(img_subfolder, final_webp_name)
                  shutil.copy2(temp_webp_path, subfolder_dest)

                  temp_entries.append((orig_path, temp_webp_path, final_webp_name))

              for orig_path, temp_webp_path, final_webp_name in temp_entries:
                  if os.path.exists(orig_path):
                      os.remove(orig_path)
                  final_dest = os.path.join(root, final_webp_name)
                  os.rename(temp_webp_path, final_dest)

              rel_path = os.path.join(folder, final_webp_name)
              purges.append(rel_path.replace('\\', '/'))

              result[folder] = final_names

          result = dict(sorted(result.items()))
          with open("images.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          repo = os.environ.get('GITHUB_REPOSITORY', '')
          branch = os.environ.get('GITHUB_REF_NAME', 'main')
          if repo:
              for item in ['images.json'] + purges[:35]:
                  url = f"https://purge.jsdelivr.net/gh/{repo}@{branch}/{item}"
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      urllib.request.urlopen(req, timeout=5)
                  except Exception:
                      pass
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto crop 16:9, convert WebP and sync images.json [skip ci]"
            git push
          fi
