name: Auto Convert WebP to Suite Subfolder

on:
  push:
    paths:
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '.github/workflows/update-images.yml'
  workflow_dispatch:

jobs:
  optimize_and_sync:
    name: Convert & Archive
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow Imaging Library
        run: |
          pip install --upgrade Pillow

      - name: Process Images to Nested Suite Subfolder
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - << 'EOF'
          import os
          import re
          import json
          import shutil
          import urllib.request
          from PIL import Image

          img_exts = ('.png', '.jpg', '.jpeg')
          WEBP_QUALITY = 92

          def natural_sort_key(s):
              return [int(t) if t.isdigit() else t.lower() for t in re.split(r'(\d+)', s)]

          def process_image(src_path, dest_path):
              # 保留原图原始分辨率与长宽比，仅转换格式
              with Image.open(src_path) as im:
                  if im.mode not in ('RGB', 'RGBA'):
                      im = im.convert('RGBA')

                  os.makedirs(os.path.dirname(dest_path), exist_ok=True)
                  im.save(dest_path, 'WEBP', quality=WEBP_QUALITY, method=6)

          result = {}
          purges = []
          repo_root = '.'

          suite_dirs = [
              d for d in os.listdir(repo_root)
              if os.path.isdir(os.path.join(repo_root, d))
              and not d.startswith('.')
              and not d.startswith('__')
          ]
          suite_dirs.sort(key=natural_sort_key)

          for suite_name in suite_dirs:
              suite_dir = os.path.join(repo_root, suite_name)
              sub_archive_dir = os.path.join(suite_dir, suite_name)

              # 清理残留的旧同级 webp 与旧 card-xx 目录
              for item in os.listdir(suite_dir):
                  item_path = os.path.join(suite_dir, item)
                  if item != suite_name and os.path.isdir(item_path) and re.match(r'^card-\d+$', item):
                      shutil.rmtree(item_path, ignore_errors=True)
                  elif os.path.isfile(item_path) and item.lower().endswith('.webp'):
                      os.remove(item_path)

              # 扫描图片原图
              imgs = [
                  f for f in os.listdir(suite_dir)
                  if os.path.isfile(os.path.join(suite_dir, f))
                  and f.lower().endswith(img_exts)
                  and not f.startswith('__')
              ]

              if not imgs and os.path.isdir(sub_archive_dir):
                  nested_imgs = [
                      f for f in os.listdir(sub_archive_dir)
                      if os.path.isfile(os.path.join(sub_archive_dir, f))
                      and f.lower().endswith(img_exts)
                      and not f.startswith('__')
                  ]
                  if nested_imgs:
                      for f in nested_imgs:
                          shutil.move(os.path.join(sub_archive_dir, f), os.path.join(suite_dir, f))
                      imgs = nested_imgs

              if not imgs:
                  continue

              imgs.sort(key=natural_sort_key)
              pad = max(2, len(str(len(imgs))))

              os.makedirs(sub_archive_dir, exist_ok=True)

              webp_names = []
              for idx, orig_file in enumerate(imgs, start=1):
                  base_name = f"card-{idx:0{pad}d}.webp"
                  webp_names.append(base_name)

                  orig_png_path = os.path.join(suite_dir, orig_file)
                  nested_dest_webp = os.path.join(sub_archive_dir, base_name)
                  process_image(orig_png_path, nested_dest_webp)

                  purges.append(f"{suite_name}/{suite_name}/{base_name}")

              # key 设置为二级目录路径，value 仅为纯文件名列表
              json_key = f"{suite_name}/{suite_name}"
              result[json_key] = webp_names

          result = dict(sorted(result.items()))
          with open("images.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          repo = os.environ.get('GITHUB_REPOSITORY', '')
          branch = os.environ.get('GITHUB_REF_NAME', 'main')
          if repo:
              for item in ['images.json'] + purges[:35]:
                  url = f"https://purge.jsdelivr.net/gh/{repo}@{branch}/{item}"
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      urllib.request.urlopen(req, timeout=5)
                  except Exception:
                      pass
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update images.json suite keys and convert webp [skip ci]"
            git push
          fi
